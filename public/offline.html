<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline – Familien-Inventar</title>
    <style>
      body {
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        background: #f9fafb;
        color: #111827;
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
        margin: 0;
      }
      .box {
        max-width: 360px;
      }
      h1 {
        font-size: 1.5rem;
        margin-bottom: 0.5rem;
      }
      p {
        color: #6b7280;
      }
      button {
        margin-top: 1rem;
        padding: 0.6rem 1.2rem;
        border-radius: 0.375rem;
        background: #111827;
        color: #fff;
        border: none;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>Keine Verbindung</h1>
      <p>
        Diese Seite ist offline nicht verfügbar. Bitte prüfe deine
        Internetverbindung.
      </p>
      <button onclick="location.reload()">Erneut versuchen</button>
    </div>
  </body>
</html>
